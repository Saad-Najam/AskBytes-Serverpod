services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: askbytes
      POSTGRES_PASSWORD: "S7QQfUs-2lGzKW55LpTAy2uywE0B3ELb"
    volumes:
      - askbytes_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "e0plHISONqmMQu0JItY2vNZbK5RHhb1d"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: askbytes_test
      POSTGRES_PASSWORD: "WAotDATf-WGHkPe5RI_2nz3DiW-eOM0d"
    volumes:
      - askbytes_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "KkdAYW-80RD0YXtSgdKIzCTK4ZPSBWEq"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  askbytes_data:
  askbytes_test_data:
